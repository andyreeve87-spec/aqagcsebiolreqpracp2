        // --- COMPONENT: Dictation / Speech to Text ---
        function DictationButton({ onDictation, lang, ui, disabled }) {
            const [isListening, setIsListening] = useState(false);
            const [notSupported, setNotSupported] = useState(false);
            const recognitionRef = useRef(null);
            
            useEffect(() => {
                if (disabled && isListening) {
                    if (recognitionRef.current) recognitionRef.current.stop();
                    setIsListening(false);
                }
            }, [disabled, isListening]);

            const toggleListen = () => {
                if (disabled) return;
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setNotSupported(true);
                    return;
                }
                
                if (isListening) {
                    if (recognitionRef.current) {
                        recognitionRef.current.stop();
                    }
                    setIsListening(false);
                    return;
                }
                
                const recognition = new SpeechRecognition();
                recognition.lang = DICT_LANGS[lang] || 'en-GB';
                recognition.continuous = true; 
                recognition.interimResults = false;
                
                recognition.onstart = () => setIsListening(true);
                
                recognition.onresult = function(e) {
                    const lastIdx = e.results.length - 1;
                    const latestResult = e.results[lastIdx];
                    if (latestResult.isFinal) {
                        onDictation(latestResult[0].transcript);
                    }
                };
                
                recognition.onerror = function(e) {
                    console.error("Speech recognition error:", e);
                    setIsListening(false);
                };
                
                recognition.onend = function() {
                    setIsListening(false);
                };
                
                recognitionRef.current = recognition;
                recognition.start();
            };
            
            return (
                <div className="flex items-center gap-2">
                    <button 
                        type="button"
                        onClick={toggleListen}
                        disabled={disabled}
                        className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors ${isListening ? 'bg-red-100 text-red-600 border-red-300 animate-pulse shadow-inner' : 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200 shadow-sm'} border disabled:opacity-50`}
                    >
                        {isListening ? (
                            <><i className="ph-fill ph-stop-circle icon-md"></i> {ui.stopDict}</>
                        ) : (
                            <><i className="ph-fill ph-microphone icon-md"></i> {ui.startDict}</>
                        )}
                    </button>
                    {notSupported && <span className="text-red-500 text-sm font-medium bg-red-50 px-2 py-1 rounded">{ui.notSupported}</span>}
                </div>
            );
        }

        // --- COMPONENT: Speak Question Button (Text-to-Speech) ---
        function SpeakQuestionButton({ text, langCode, ui }) {
            const [isSpeaking, setIsSpeaking] = useState(false);

            useEffect(() => {
                window.speechSynthesis.cancel();
                setIsSpeaking(false);
                return () => window.speechSynthesis.cancel();
            }, [text]);

            const toggleSpeak = () => {
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                } else {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = langCode;
                    utterance.onend = () => setIsSpeaking(false);
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                    setIsSpeaking(true);
                }
            };

            return (
                <button
                    onClick={toggleSpeak}
                    title={isSpeaking ? ui.stopReading : ui.readAloud}
                    className={`flex-shrink-0 p-2 rounded-full transition-colors flex items-center justify-center mt-1 ${isSpeaking ? 'bg-sky-200 text-sky-800 shadow-inner' : 'bg-sky-100 text-sky-700 hover:bg-sky-200 shadow-sm'}`}
                >
                    <i className={`ph-fill ${isSpeaking ? 'ph-stop-circle' : 'ph-speaker-high'} icon-md`}></i>
                </button>
            );
        }

                                    <div className="space-y-4 text-sm">
                                        <div>
                                            <strong className="text-green-700 flex items-center gap-1 mb-2"><i className="ph-fill ph-check-circle icon-md"></i> {ui.didWell}</strong>
                                            <ul className="list-disc pl-6 text-slate-700 space-y-1">
                                                {feedback.positivePoints.length > 0 ? feedback.positivePoints.map((p, idx) => <li key={idx}>{p}</li>) : <li>Attempt submitted.</li>}
                                            </ul>
                                        </div>
                                        {feedback.marks < eq.maxMarks && (
                                            <div className="bg-amber-50 p-3 rounded-lg border border-amber-200">
                                                <strong className="text-amber-800 flex items-center gap-1 mb-1"><i className="ph-fill ph-warning-circle icon-md"></i> {ui.toImprove}</strong>
                                                <p className="text-amber-900">{feedback.improvement}</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Model Answers Dropdown (Interactive View) */}
                    {showModels && (
                        <div className="bg-slate-50 p-6 border-t border-slate-200 animate-in slide-in-from-top-2 interactive-container">
                            <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="ph-bold ph-book-open text-sky-600 icon-lg"></i> Levelled Model Answers</h4>
                            <div className="grid md:grid-cols-3 gap-4">
                                <div className="p-4 bg-orange-50 border-l-4 border-orange-400 rounded-lg flex flex-col shadow-sm">
                                    <span className="text-xs font-bold text-orange-800 uppercase tracking-wider block mb-2">{ui.lvl1}</span>
                                    <p className="text-sm text-slate-700 italic flex-1">"{eq.models.level1}"</p>
                                </div>
                                <div className="p-4 bg-blue-50 border-l-4 border-blue-400 rounded-lg flex flex-col shadow-sm">
                                    <span className="text-xs font-bold text-blue-800 uppercase tracking-wider block mb-2">{ui.lvl2}</span>
                                    <p className="text-sm text-slate-700 italic flex-1">"{eq.models.level2}"</p>
                                </div>
                                <div className="p-4 bg-green-50 border-l-4 border-green-500 rounded-lg flex flex-col shadow-sm">
                                    <span className="text-xs font-bold text-green-800 uppercase tracking-wider block mb-2">{ui.lvl3}</span>
                                    <p className="text-sm text-slate-700 italic flex-1">"{eq.models.level3}"</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Print-Only View for this Question */}
                    <div className="print-view-container text-black bg-white mt-4 hidden">
                        <h3 className="font-semibold text-slate-600 text-sm uppercase mt-4">{ui.yourAns}</h3>
                        <p className="whitespace-pre-wrap text-slate-800 text-base mt-2 p-4 bg-slate-50 border border-slate-200 rounded">{answer || ui.noAns}</p>
                        
                        {feedback ? (
                            <div className="mt-4 border-l-4 border-sky-500 pl-4 py-2">
                                <h3 className="font-bold text-lg text-slate-800 mb-2">{ui.autoFeed} ({feedback.marks} / {eq.maxMarks})</h3>
                                <p className="text-sm font-semibold text-slate-600 uppercase mt-2 mb-1">{ui.didWell}</p>
                                <ul className="list-disc pl-5 text-slate-800 text-sm mb-2">
                                    {feedback.positivePoints.map((p, idx) => <li key={idx}>{p}</li>)}
                                </ul>
                                {feedback.marks < eq.maxMarks && (
                                    <>
                                        <p className="text-sm font-semibold text-slate-600 uppercase mt-3 mb-1">{ui.toImprove}</p>
                                        <p className="text-base text-slate-800 bg-amber-50 p-3 border border-amber-200 rounded">{feedback.improvement}</p>
                                    </>
                                )}
                            </div>
                        ) : (
                            <div className="mt-4 text-slate-500 italic">
                                {ui.notMarked}
                            </div>
                        )}

                        <div className="mt-4">
                            <h3 className="font-bold text-lg text-slate-800 mb-2">Model Answer ({ui.lvl3}):</h3>
                            <p className="whitespace-pre-wrap text-slate-800 text-base p-4 bg-green-50 border border-green-200 rounded">{eq.models.level3}</p>
                        </div>
                    </div>

                </div>
            );
        }

        // --- COMPONENT: Booklet View ---
        function BookletView({ lang, ui, setViewMode }) {
            const handlePrint = () => window.print();

            return (
                <div className="animate-in fade-in bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden mb-8">
                    <div className="bg-sky-700 p-6 flex justify-between items-center interactive-container">
                        <button onClick={() => setViewMode('practicals')} className="px-4 py-2 bg-sky-800 text-white rounded-lg hover:bg-sky-900 font-medium flex items-center gap-2 transition-colors border border-sky-600">
                            <i className="ph-bold ph-arrow-left icon-md"></i> {ui.backBtn}
                        </button>
                        <button onClick={handlePrint} className="px-6 py-2 bg-white text-sky-800 rounded-lg hover:bg-sky-50 font-bold flex items-center gap-2 transition-colors shadow-sm">
                            <i className="ph-bold ph-printer icon-md"></i> {ui.printBooklet}
                        </button>
                    </div>

                    <div className="p-8 sm:p-12 print-view-container block">
                        <div className="text-center mb-12 border-b-2 border-sky-800 pb-8">
                            <h1 className="text-4xl font-bold text-slate-900 mb-2">{ui.title}</h1>
                            <h2 className="text-2xl text-sky-700 font-semibold">{ui.modelAnsTitle}</h2>
                            <p className="mt-4 text-slate-500 text-lg">{ui.createdBy}</p>
                        </div>

                        <div className="space-y-12">
                            {PRACTICALS.map((p, index) => (
                                <div key={p.id} className={index > 0 ? "print-page-break mt-12 pt-8 border-t-4 border-slate-100" : ""}>
                                    <h3 className="text-2xl font-bold text-sky-800 mb-6 flex items-center gap-3">
                                        <i className={`ph-fill ${p.icon} text-3xl`}></i> {p.title[lang]}
                                    </h3>
                                    <div className="space-y-8">
                                        {p.questions.map(q => (
                                            <div key={q.id} className="print-avoid-break bg-slate-50 p-6 rounded-xl border border-slate-200">
                                                <p className="font-bold text-slate-900 text-lg mb-4 flex items-start gap-2">
                                                    <span className="shrink-0 text-sky-600">Q.</span> 
                                                    <span>{q.q[lang]} <span className="text-sky-700 text-sm ml-1 font-semibold">[{q.maxMarks} Marks]</span></span>
                                                </p>
                                                <div className="pl-4 border-l-4 border-sky-500 bg-white p-4 rounded-r-lg shadow-sm">
                                                    <p className="text-xs font-bold text-sky-700 uppercase tracking-wider mb-2">Model Answer ({ui.lvl3})</p>
                                                    <p className="text-slate-800 whitespace-pre-wrap leading-relaxed">{q.models.level3}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENT: Practical Tab Container ---
        function PracticalTab({ practical, lang, ui }) {
            const [answers, setAnswers] = useState({});
            const [feedbacks, setFeedbacks] = useState({});

            const handlePrint = () => {
                window.print();
            };

            return (
                <div>
                    {/* Print Header (Only visible on print) */}
                    <div className="print-view-container text-black bg-white mb-8 hidden">
                        <div className="border-b-2 border-slate-800 pb-4">
                            <h1 className="text-3xl font-bold text-slate-900">{ui.title}</h1>
                            <p className="text-slate-600 text-lg">{ui.createdBy}</p>
                            <h2 className="text-2xl font-bold text-sky-700 mt-4">{practical.title[lang]}</h2>
                        </div>
                    </div>

                    {/* Synopsis Box added here */}
                    <SynopsisBox practical={practical} lang={lang} ui={ui} />

                    <div className="flex flex-col gap-2">
                        {practical.questions.map(q => (
                            <QuestionCard 
                                key={q.id} 
                                eq={q} 
                                lang={lang} 
                                ui={ui} 
                                answer={answers[q.id] || ""}
                                setAnswer={(val) => setAnswers(prev => ({...prev, [q.id]: typeof val === 'function' ? val(prev[q.id]||"") : val}))}
                                feedback={feedbacks[q.id]}
                                setFeedback={(val) => setFeedbacks(prev => ({...prev, [q.id]: val}))}
                            />
                        ))}
                    </div>

                    {/* Master Print Button */}
                    <div className="interactive-container mt-8 flex justify-center pb-12">
                        <button onClick={handlePrint} className="px-8 py-4 bg-white text-sky-700 border-2 border-sky-300 rounded-xl hover:bg-sky-50 font-bold flex items-center gap-3 cursor-pointer shadow-md text-lg transition-transform hover:scale-105">
                            <i className="ph-bold ph-printer icon-lg"></i> {ui.printFeed}
                        </button>
                    </div>
                </div>
            );
        }

        // --- MAIN APP LAYOUT ---
        function App() {
          const [activePracticalId, setActivePracticalId] = useState(PRACTICALS[0].id); 
          const [lang, setLang] = useState('en');
          const [viewMode, setViewMode] = useState('practicals');

          const handleTabSwitch = (id) => {
              setActivePracticalId(id);
          };

          const activePractical = PRACTICALS.find(p => p.id === activePracticalId);
          const ui = UI_TEXT[lang];

          return (
            <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans print:bg-white print:min-h-0">
              <header className="bg-sky-700 text-white p-6 shadow-md interactive-container">
                <div className="max-w-6xl mx-auto">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                        <div className="overflow-hidden max-w-full flex items-center gap-4">
                            <div className="bg-white/20 p-3 rounded-2xl shadow-inner hidden sm:flex transition-all duration-300">
                                <i className={`ph-fill ${activePractical.icon} text-5xl text-white`}></i>
                            </div>
                            <div>
                                <h1 className="text-2xl md:text-3xl font-bold flex items-center gap-2 whitespace-nowrap overflow-x-auto pb-1">
                                    <i className={`ph-bold ${activePractical.icon} icon-xl shrink-0 sm:hidden`}></i>
                                    {ui.title}
                                </h1>
                                <div className="text-sky-100 mt-2 flex flex-wrap items-center gap-2 sm:gap-3">
                                    <span>{ui.subtitle}</span>
                                    <span className="hidden sm:inline text-sky-300">•</span>
                                    <span className="text-white font-medium bg-sky-600/50 px-2.5 py-1 rounded flex items-center gap-1.5 text-sm">
                                        <i className="ph-fill ph-chalkboard-teacher"></i> {ui.createdBy}
                                    </span>
                                    <span className="hidden sm:inline text-sky-300">•</span>
                                    <select 
                                        value={lang} 
                                        onChange={(e) => setLang(e.target.value)}
                                        className="bg-sky-800 text-white font-semibold border border-sky-500 rounded-md px-2 py-1 text-sm outline-none hover:bg-sky-600 cursor-pointer shadow-sm transition-colors"
                                    >
                                        <option value="en">🇬🇧 English</option>
                                        <option value="ro">🇷🇴 Română</option>
                                        <option value="pl">🇵🇱 Polski</option>
                                        <option value="uk">🇺🇦 Українська</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Booklet Button */}
                        <div className="w-full lg:w-auto flex items-center lg:justify-end">
                            <button onClick={() => setViewMode(viewMode === 'booklet' ? 'practicals' : 'booklet')} className="w-full lg:w-auto bg-white text-sky-800 font-bold px-5 py-2.5 rounded-xl shadow-md hover:bg-sky-50 transition-transform hover:scale-105 flex items-center justify-center gap-2 border-2 border-sky-100">
                                <i className={`ph-bold ${viewMode === 'booklet' ? 'ph-arrow-left' : 'ph-book-open'} icon-md`}></i> 
                                {viewMode === 'booklet' ? ui.backBtn : ui.bookletBtn}
                            </button>
                        </div>
                    </div>
                    
                    {/* Named Tabs Navigation */}
                    {viewMode === 'practicals' && (
                        <div className="mt-6 pt-5 border-t border-sky-600/50">
                            <nav className="tab-navigation flex flex-wrap gap-2">
                                {PRACTICALS.map(p => (
                                    <button 
                                        key={p.id}
                                        onClick={() => handleTabSwitch(p.id)} 
                                        className={`px-4 py-2.5 rounded-lg font-bold transition-all text-sm flex items-center gap-2 shadow-sm
                                            ${activePracticalId === p.id ? 'bg-red-600 text-white scale-105 shadow-md ring-2 ring-red-400 ring-offset-2 ring-offset-sky-700' : 'bg-white text-slate-800 hover:bg-slate-100 border border-transparent hover:border-slate-300'}`}
                                    >
                                        <i className={`ph-bold ${p.icon} text-lg`}></i>
                                        <span className="whitespace-nowrap">{p.title[lang]}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    )}
                </div>
              </header>

              <main className="flex-1 w-full max-w-5xl mx-auto p-4 py-10">
                {viewMode === 'practicals' ? (
                    <PracticalTab 
                        key={activePracticalId} 
                        practical={activePractical} 
                        lang={lang} 
                        ui={ui} 
                    />
                ) : (
                    <BookletView lang={lang} ui={ui} setViewMode={setViewMode} />
                )}
              </main>

              <footer className="interactive-container text-center p-6 text-slate-500 text-sm font-medium">
                {ui.createdBy} for AQA GCSE Biology
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
